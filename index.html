<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horae</title>
    <meta name="description" content="A to-do app that sorts every task by month, day and hour, and keeps the tasks you missed." />
    <meta name="theme-color" content="#0c0b10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap"
    />
    <style>
      /* Shown until React mounts: a turning rune, not a spinner. */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #ece6da; }
      .boot svg { width: 72px; height: 72px; animation: boot-turn 1.6s cubic-bezier(.7,0,.3,1) infinite; }
      .boot p { position: absolute; bottom: 18%; margin: 0; font: 800 12px/1 system-ui, sans-serif; letter-spacing: 6px; color: #0c0b10; }
      @keyframes boot-turn { 0% { transform: rotate(0); } 50%, 100% { transform: rotate(120deg); } }
      @media (prefers-reduced-motion: reduce) { .boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Horae">
        <svg viewBox="-50 -50 100 100" aria-hidden="true">
          <circle r="44" fill="none" stroke="#0c0b10" stroke-width="4" />
          <path d="M0-38 33 19H-33Z" fill="none" stroke="#c2185b" stroke-width="5" stroke-linejoin="miter" />
          <path d="M0-38V19M-16.5-9.5 16.5-9.5" stroke="#0c0b10" stroke-width="4" />
        </svg>
        <p>SPINNING THE HOURS</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
